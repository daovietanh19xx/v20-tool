<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiểm tra khám sức khỏe</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #f4f6f8; color: #1c2430; }
    header { background: #16324f; color: white; padding: 18px 24px; }
    header h1 { margin: 0 0 6px; font-size: 22px; }
    header p { margin: 0; color: #d5e2ee; }
    main { padding: 18px 24px 40px; }
    .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: white; padding: 14px; border-radius: 10px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    input, button { font: inherit; }
    input[type="text"], input[type="date"] { border: 1px solid #c5d0db; border-radius: 6px; padding: 8px; }
    button { border: 0; border-radius: 6px; padding: 9px 14px; background: #16324f; color: white; cursor: pointer; }
    button.secondary { background: #4d6478; }
    button:disabled { opacity: 0.55; cursor: wait; }
    .stats { margin: 14px 0; display: flex; gap: 16px; }
    .card { background: white; border-radius: 10px; padding: 10px 14px; }
    .warn { color: #8a4b08; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border-bottom: 1px solid #e4ebf2; padding: 6px; vertical-align: top; font-size: 13px; }
    th { text-align: left; background: #e8eef5; position: sticky; top: 0; }
    tr.uncertain { background: #fff6e8; }
    tr.ok { background: #eefaf1; }
    tr.bad { background: #fdeeee; }
    td input[type="text"] { width: 100%; box-sizing: border-box; }
    td.photo { min-width: 420px; }
    td.photo img { width: 420px; height: auto; background: white; }
    .hint { color: #66788a; font-size: 12px; margin-top: 4px; }
    .log { white-space: pre-wrap; background: #101820; color: #d7e6f5; padding: 12px; border-radius: 10px; min-height: 72px; }
    .error { color: #9d1c1c; font-weight: 600; }
    .wrap { display: flex; flex-direction: column; gap: 12px; }
    article { background: white; border-radius: 10px; padding: 12px; border: 1px solid #e4ebf2; }
    article.uncertain { background: #fff6e8; }
    article.ok { background: #eefaf1; }
    article.bad { background: #fdeeee; }
    article.missing { background: #f8d0dc; }
    .result { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.72); display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 4px 12px; font-size: 13px; }
    .result strong { display: block; font-size: 12px; color: #4d6478; font-weight: 600; }
    article img { width: min(100%, 980px); background: white; border: 1px solid #d5dee8; }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
    .checkline { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
    .images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .images button.on { outline: 3px solid #d97706; }
    input[type="password"], select { border: 1px solid #c5d0db; border-radius: 6px; padding: 8px; }
    .note { color: #3d4d5e; font-size: 13px; margin: 8px 0 0; }
    .status { display: flex; align-items: center; gap: 8px; margin-top: 12px; min-height: 28px; font-weight: 600; }
    .status.busy { color: #16324f; }
    .status.done { color: #1f7a3a; }
    .status.bad { color: #9d1c1c; }
    .spin { width: 16px; height: 16px; border: 2px solid #c5d0db; border-top-color: #16324f; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>Kiểm tra danh sách khám sức khỏe</h1>
    <p>Tải ảnh, đọc bằng OCR máy hoặc API, rồi sửa dòng chưa chắc. Khóa API không được ghi ra máy.</p>
  </header>
  <main>
    <div class="bar">
      <label>Từ ngày <input id="tu" type="text" value="01/06/2026"></label>
      <label>Đến ngày <input id="den" type="text" value="21/11/2026"></label>
      <label>Cách đọc
        <select id="engine">
          <option value="local">OCR trên máy</option>
          <option value="llm">API tương thích OpenAI</option>
        </select>
      </label>
      <label>Địa chỉ API <input id="apiBase" type="text" value="https://api.openai.com/v1" autocomplete="off"></label>
      <label>Model <input id="model" type="text" value="gpt-4o-mini" autocomplete="off"></label>
      <label>Khóa API <input id="apiKey" type="password" autocomplete="off" placeholder="Chỉ dùng cho lần đọc này"></label>
      <button id="doc" class="action" type="button">Đọc ảnh đang chọn</button>
      <button id="luu" class="action" type="button">Lưu chỉnh sửa</button>
      <a href="/ket-qua.csv"><button class="secondary action" type="button">Tải CSV</button></a>
    </div>
    <p class="note">Khóa API chỉ đi từ ô này tới chương trình cục bộ rồi tới nhà cung cấp. Chương trình không ghi khóa vào file.</p>
    <div class="bar">
      <label>Tải ảnh vào anh_can_check <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
      <button id="upload" class="action" type="button">Tải ảnh lên</button>
      <button id="all" class="secondary" type="button">Xem mọi ảnh</button>
    </div>
    <div class="images" id="images"></div>
    <div id="status" class="status" role="status"><span id="spin" class="spin" hidden></span><span id="status-text">Sẵn sàng</span></div>
    <div class="stats">
      <div class="card">Tổng dòng: <strong id="tong">0</strong></div>
      <div class="card warn">Cần xem lại: <strong id="can">0</strong></div>
      <div class="card" id="error"></div>
    </div>
    <div class="wrap" id="body"></div>
  </main>
  <script>
    const body = document.querySelector("#body");
    let selectedAnh = "";
    let lastImages = "";
    function collect() {
      return [...body.querySelectorAll("article[data-id]")].map((row) => ({
        id: row.dataset.id,
        xac_nhan: row.querySelector(".xac").checked,
        stt: row.querySelector(".stt").value,
        ho_ten: row.querySelector(".ten").value,
        ngay_sinh: row.querySelector(".ns").value,
        gioi_tinh: row.querySelector(".gt").value,
        cccd: row.querySelector(".cccd").value,
        dia_chi: row.querySelector(".dc").value,
      }));
    }
    function render(data) {
      const active = document.activeElement;
      const keep = active && active.dataset ? active.dataset.key : "";
      body.innerHTML = "";
      const rows = selectedAnh ? data.rows.filter((row) => row.anh === selectedAnh) : data.rows;
      for (const row of rows) {
        const card = document.createElement("article");
        card.dataset.id = row.id;
        if (row.ket_luan === "DUNG_HET") card.className = "ok";
        else if (row.ket_luan === "KHONG_CO_TREN_HE_THONG") card.className = "missing";
        else if (row.ket_luan === "SAI_THONG_TIN" || row.ket_luan === "LOI_KIEM_TRA") card.className = "bad";
        else if (row.khong_chac_chan) card.className = "uncertain";
        const note = row.ly_do || "";
        const checked = row.ket_luan ? `
          <div class="result">
            <div><strong>Kết luận</strong>${escapeHtml(row.ket_luan)}</div>
            <div><strong>Có trên hệ thống</strong>${escapeHtml(row.co_tren_he_thong || "")}</div>
            <div><strong>Khớp họ tên</strong>${escapeHtml(row.khop_ho_ten || "")}</div>
            <div><strong>Khớp giới tính</strong>${escapeHtml(row.khop_gioi_tinh || "")}</div>
            <div><strong>Khớp ngày sinh</strong>${escapeHtml(row.khop_ngay_sinh || "")}</div>
            <div><strong>Họ tên trên web</strong>${escapeHtml(row.ho_ten_web || "")}</div>
            <div><strong>Giới tính trên web</strong>${escapeHtml(row.gioi_tinh_web || "")}</div>
            <div><strong>Ngày sinh trên web</strong>${escapeHtml(row.ngay_sinh_web || "")}</div>
            <div><strong>Ghi chú</strong>${escapeHtml(row.ghi_chu || "")}</div>
          </div>` : "";
        const photo = row.anh_dong ? `<img alt="Dòng ${escapeHtml(row.stt)}" src="/anh-dong/${encodeURIComponent(row.anh_dong)}">` : "";
        card.innerHTML = `
          <div class="checkline"><label><input class="xac" type="checkbox" ${row.xac_nhan ? "checked" : ""}> Đưa vào kiểm tra</label><strong>${escapeHtml(row.anh)} · ${escapeHtml(row.ket_luan || "Chưa kiểm tra")}${row.do_tin_cay ? " · tin cậy " + escapeHtml(row.do_tin_cay) : ""}</strong></div>
          ${photo}
          <div class="fields">
            <label>STT<input class="stt" data-key="${row.id}-stt" type="text" value="${escapeHtml(row.stt)}"></label>
            <label>Họ tên<input class="ten" data-key="${row.id}-ten" type="text" value="${escapeHtml(row.ho_ten)}"></label>
            <label>Ngày sinh<input class="ns" type="text" value="${escapeHtml(row.ngay_sinh)}"></label>
            <label>Giới tính<input class="gt" type="text" value="${escapeHtml(row.gioi_tinh)}"></label>
            <label>CCCD<input class="cccd" type="text" value="${escapeHtml(row.cccd)}"></label>
            <label>Địa chỉ<input class="dc" type="text" value="${escapeHtml(row.dia_chi)}"></label>
          </div>
          ${checked}
          ${note ? `<div class="hint">${escapeHtml(note)}</div>` : ""}`;
        body.appendChild(card);
      }
      document.querySelector("#tong").textContent = data.tong;
      document.querySelector("#can").textContent = data.can_sua;
      document.querySelector("#error").textContent = data.error || "";
      document.querySelector("#error").className = data.error ? "card error" : "card";
      if (document.activeElement !== document.querySelector("#tu")) document.querySelector("#tu").value = data.tu_ngay || "";
      if (document.activeElement !== document.querySelector("#den")) document.querySelector("#den").value = data.den_ngay || "";
      document.querySelectorAll("button.action").forEach((button) => button.disabled = data.busy || Boolean(pending));
      if (keep) {
        const field = body.querySelector(`[data-key="${keep}"]`);
        if (field) field.focus();
      }
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    let lastSignature = "";
    let pending = "";
    let notice = "";
    let clientError = "";
    function showStatus(data) {
      const box = document.querySelector("#status");
      const spin = document.querySelector("#spin");
      const text = document.querySelector("#status-text");
      const latest = (data.log || []).slice(-1)[0] || "";
      if (data.busy || pending) {
        box.className = "status busy";
        spin.hidden = false;
        text.textContent = pending || latest || "Đang xử lý...";
        return;
      }
      spin.hidden = true;
      const problem = clientError || data.error || "";
      if (problem) {
        box.className = "status bad";
        text.textContent = problem;
        return;
      }
      box.className = "status done";
      text.textContent = notice || latest || "Sẵn sàng";
    }
    async function refresh() {
      const response = await fetch("/api/trang-thai");
      const data = await response.json();
      showStatus(data);
      document.querySelector("#tong").textContent = data.tong;
      document.querySelector("#can").textContent = data.can_sua;
      document.querySelector("#error").textContent = data.error || "";
      document.querySelector("#error").className = data.error ? "card error" : "card";
      document.querySelectorAll("button.action").forEach((button) => button.disabled = data.busy || Boolean(pending));
      renderImages(data.anh || []);
      if (body.contains(document.activeElement)) return;
      const signature = JSON.stringify(data.rows) + "|" + data.tu_ngay + "|" + data.den_ngay;
      if (signature === lastSignature) return;
      lastSignature = signature;
      render(data);
    }
    function renderImages(images) {
      const signature = JSON.stringify(images) + "|" + selectedAnh;
      if (signature === lastImages) return;
      lastImages = signature;
      const box = document.querySelector("#images");
      box.innerHTML = "";
      for (const image of images) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = image.ten === selectedAnh ? "on" : "secondary";
        button.textContent = image.ten + (image.da_doc ? ` · đã đọc ${image.so_dong} dòng` : " · chưa đọc");
        button.onclick = () => {
          selectedAnh = image.ten;
          lastSignature = "";
          lastImages = "";
          refresh();
        };
        box.appendChild(button);
      }
    }
    async function post(url, extra, startMessage) {
      pending = startMessage || "Đang xử lý...";
      notice = "";
      clientError = "";
      showStatus({ busy: true, log: [], error: "" });
      document.querySelectorAll("button.action").forEach((button) => button.disabled = true);
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({
          rows: collect(),
          tu_ngay: document.querySelector("#tu").value,
          den_ngay: document.querySelector("#den").value,
        }, extra || {})),
      });
      const payload = await response.json();
      pending = "";
      if (!payload.ok) clientError = payload.message || "Không thực hiện được";
      await refresh();
      return payload.ok;
    }
    document.querySelector("#doc").onclick = () => {
      const engine = document.querySelector("#engine").value;
      const extra = {
        engine,
        anh: selectedAnh ? [selectedAnh] : [],
        api_base: document.querySelector("#apiBase").value,
        model: document.querySelector("#model").value,
        api_key: engine === "llm" ? document.querySelector("#apiKey").value : "",
      };
      if (!selectedAnh && !confirm("Chưa chọn ảnh. Đọc tất cả ảnh trong thư mục?")) return;
      post("/api/doc", extra, "Đang đọc ảnh...");
    };
    document.querySelector("#upload").onclick = async () => {
      const input = document.querySelector("#file");
      if (!input.files.length) {
        alert("Chọn ít nhất một ảnh.");
        return;
      }
      const form = new FormData();
      for (const file of input.files) form.append("anh", file);
      pending = "Đang tải ảnh lên...";
      notice = "";
      clientError = "";
      showStatus({ busy: true, log: [], error: "" });
      const response = await fetch("/api/anh", { method: "POST", body: form });
      const payload = await response.json();
      pending = "";
      if (payload.ok) notice = "Đã tải ảnh lên.";
      else clientError = payload.message || "Không tải được ảnh";
      input.value = "";
      lastImages = "";
      await refresh();
    };
    document.querySelector("#all").onclick = () => {
      selectedAnh = "";
      lastSignature = "";
      lastImages = "";
      refresh();
    };
    document.querySelector("#luu").onclick = async () => {
      const ok = await post("/api/luu", null, "Đang lưu chỉnh sửa...");
      if (ok) notice = "Đã lưu chỉnh sửa.";
      showStatus({ busy: false, log: [], error: ok ? "" : document.querySelector("#status-text").textContent });
    };
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
